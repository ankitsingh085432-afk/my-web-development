<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .container{
            position: relative;
            background-color: blue;
            height: 80vh;
            width: 80vw;
            
        }
        .box{
            background-color: rgb(222, 36, 36);
            height: 121px;
            width: 121px;
            border-radius:70px;
            position: absolute;
            left: 0;
            bottom: 0; 
            animation:animateX 3s linear 10,animateY 1s ease-out 10 alternate;
        }
        @keyframes animateX {
    0% {
        left: 0;
    }
    100% {
        left: calc(100% - 121px);
    }
}
        @keyframes animateY{
from{
        bottom: 0;
    }
    to {
        bottom:100%;
    }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
